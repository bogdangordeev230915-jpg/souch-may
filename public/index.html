<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CreStore</title>
<style>
:root{
  --bg:#000;
  --fg:#fff;
  --muted:#9b9b9b;
  --line:#111;
  --orange:#ff7a00;
  --panel:#fff;
  --panelText:#000;
  --radius:24px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
.app{height:100%;display:flex;flex-direction:column;background:#000}
.topbar{height:62px;display:flex;align-items:center;justify-content:center;border-bottom:2px solid #111;flex:0 0 62px}
.logo{font-size:22px;font-weight:900;letter-spacing:-1px}
.logo span{color:var(--orange)}
.content{position:relative;flex:1;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:22px 18px 120px;opacity:0;transform:translateY(30px);pointer-events:none;transition:.42s cubic-bezier(.2,.8,.2,1)}
.page.active{opacity:1;transform:none;pointer-events:auto}
.section-title{font-size:30px;font-weight:900;margin:0 0 18px}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#080808;border:2px solid #111;border-radius:22px;overflow:hidden;transition:.2s}
.card:hover{border-color:#252525;transform:translateY(-2px)}
.thumb{height:140px;background:linear-gradient(135deg,#111,#222);display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900}
.card-body{padding:15px}
.card h3{margin:0 0 6px;font-size:19px}
.card p{margin:0;color:#aaa;line-height:1.45;font-size:14px}
.meta{margin-top:12px;color:#777;font-size:12px}
.profile-wrap{max-width:1000px;margin:auto}
.cover{height:clamp(190px,40vw,400px);border:2px solid #111;border-radius:26px;overflow:hidden;position:relative;background:#111}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover-placeholder{height:100%;display:flex;align-items:center;justify-content:center;color:#777;font-weight:700}
.cover-edit{position:absolute;right:14px;top:14px;background:#fff;color:#000;padding:10px 15px;border-radius:14px;font-weight:900}
.profile-head{position:relative;padding:0 20px 20px}
.avatar{width:132px;height:132px;border:5px solid #000;border-radius:50%;background:#111;overflow:hidden;margin-top:-66px;position:relative;z-index:2;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-placeholder{height:100%;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;color:#777}
.name-row{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:12px}
.username{font-size:28px;font-weight:900}
.description{margin-top:10px;font-size:16px;line-height:1.5;font-weight:700;word-break:break-word}
.actions{display:flex;gap:10px;margin-top:18px}
.orange{background:var(--orange);color:#000;font-weight:900;border-radius:16px;padding:14px 20px;transition:.12s;box-shadow:none}
.orange:active{transform:scale(.94)}
.chat-btn{width:54px;border:2px solid #fff;background:#000;color:#fff;border-radius:16px;font-size:20px}
.bottom{height:82px;flex:0 0 82px;background:#000;border-top:2px solid #111;display:flex;align-items:center;justify-content:space-around;z-index:20}
.nav-btn{width:82px;height:60px;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;position:relative}
.nav-btn.active{color:var(--orange)}
.cubes{display:grid;grid-template-columns:repeat(2,13px);grid-template-rows:repeat(2,13px);gap:4px}
.cubes i{background:currentColor;border-radius:3px}
.person{width:28px;height:28px;position:relative}
.person:before{content:"";position:absolute;width:10px;height:10px;border:3px solid currentColor;border-radius:50%;left:6px;top:0}
.person:after{content:"";position:absolute;width:23px;height:13px;border:3px solid currentColor;border-bottom:0;border-radius:16px 16px 0 0;left:0;bottom:0}
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;color:#000;border-radius:30px 30px 0 0;padding:22px;min-height:48vh;transform:translateY(100%);transition:.38s cubic-bezier(.2,.8,.2,1)}
.sheet-backdrop.open .sheet{transform:none}
.handle{width:50px;height:5px;background:#bbb;border-radius:10px;margin:0 auto 22px}
.sheet h2{margin:0 0 10px;font-size:24px}
.sheet p{font-weight:700;line-height:1.45}
.orange-text{color:var(--orange)}
.upload{width:100%;margin-top:20px}
input[type=file]{display:none}
.textarea{width:100%;min-height:110px;border:2px solid #000;border-radius:15px;padding:12px;resize:vertical}
.color-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.color{width:34px;height:34px;border-radius:50%;border:2px solid #000}
.chat-panel{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column}
.chat-panel.open{display:flex}
.chat-header{height:64px;border-bottom:2px solid #111;display:flex;align-items:center;gap:14px;padding:0 16px}
.back{background:#fff;color:#000;border-radius:12px;padding:9px 13px;font-weight:900}
.messages{flex:1;overflow-y:auto;padding:18px}
.msg{max-width:75%;padding:11px 14px;border-radius:18px;margin:7px 0;line-height:1.35}
.msg.me{margin-left:auto;background:var(--orange);color:#000}
.msg.other{background:#151515}
.msg .who{font-size:11px;opacity:.6;margin-bottom:3px}
.chat-input{display:flex;gap:8px;padding:12px;border-top:2px solid #111}
.chat-input input{flex:1;background:#0d0d0d;color:#fff;border:2px solid #222;border-radius:15px;padding:13px;outline:none}
.empty{color:#777;text-align:center;padding:50px 15px}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:#fff;color:#000;padding:12px 18px;border-radius:14px;font-weight:900;opacity:0;pointer-events:none;transition:.25s;z-index:100}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){
 .projects{grid-template-columns:1fr}
 .page{padding-left:13px;padding-right:13px}
 .profile-head{padding-left:10px;padding-right:10px}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="logo">Cre<span>Store</span></div></header>

<main class="content">
<section id="projectsPage" class="page active">
  <h1 class="section-title">Проекты</h1>
  <div id="projects" class="projects"></div>
  <div class="empty" id="endHint">Потяни список вниз после окончания проектов, чтобы перейти к профилю.</div>
</section>

<section id="profilePage" class="page">
 <div class="profile-wrap">
  <div class="cover" id="coverBox">
   <div class="cover-placeholder" id="coverPlaceholder">ОБЛОЖКА 1920 × 768</div>
   <img id="coverImg" hidden>
   <button class="cover-edit" onclick="openUpload('cover')">ИЗМЕНИТЬ</button>
  </div>
  <div class="profile-head">
   <div class="avatar" onclick="openUpload('avatar')">
    <div class="avatar-placeholder" id="avatarPlaceholder">C</div>
    <img id="avatarImg" hidden>
   </div>
   <div class="name-row">
    <div class="username">CreUser</div>
    <div class="actions">
      <button class="orange" id="followBtn" onclick="follow()">ПОДПИСАТЬСЯ</button>
      <button class="chat-btn" onclick="openChat()">💬</button>
    </div>
   </div>
   <div id="description" class="description">Создаю игры и приложения в CreStore.</div>
   <button class="orange" style="margin-top:15px" onclick="openDescription()">ИЗМЕНИТЬ ОПИСАНИЕ</button>
  </div>
 </div>
</section>
</main>

<nav class="bottom">
 <button class="nav-btn active" id="projectsNav" onclick="switchPage('projects')"><span class="cubes"><i></i><i></i><i></i><i></i></span></button>
 <button class="nav-btn" id="profileNav" onclick="switchPage('profile')"><span class="person"></span></button>
</nav>
</div>

<div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet(event)">
 <div class="sheet" onclick="event.stopPropagation()">
   <div class="handle"></div>
   <h2 id="sheetTitle">Меняем элемент</h2>
   <p id="sheetText">Выберите файл для загрузки.</p>
   <label class="orange upload" style="display:block;text-align:center">
      ЗАГРУЗИТЬ
      <input id="fileInput" type="file" accept="image/*">
   </label>
   <div id="cropArea" hidden>
     <p>Предпросмотр аватарки.</p>
     <div style="width:220px;height:220px;border:4px solid #000;border-radius:50%;overflow:hidden;margin:15px auto">
       <img id="cropPreview" style="width:100%;height:100%;object-fit:cover">
     </div>
     <button class="orange" style="width:100%" onclick="applyAvatar()">ПРИМЕНИТЬ</button>
   </div>
 </div>
</div>

<div class="sheet-backdrop" id="descriptionSheet" onclick="closeDescription(event)">
 <div class="sheet" onclick="event.stopPropagation()">
  <div class="handle"></div>
  <h2>Описание профиля</h2>
  <textarea id="descInput" class="textarea"></textarea>
  <p>Цвет текста</p>
  <div class="color-row">
   <button class="color" style="background:#fff" onclick="setDescColor('#fff')"></button>
   <button class="color" style="background:#ff3b30" onclick="setDescColor('#ff3b30')"></button>
   <button class="color" style="background:#ff9500" onclick="setDescColor('#ff9500')"></button>
   <button class="color" style="background:#ffd60a" onclick="setDescColor('#ffd60a')"></button>
   <button class="color" style="background:#34c759" onclick="setDescColor('#34c759')"></button>
   <button class="color" style="background:#00c7be" onclick="setDescColor('#00c7be')"></button>
   <button class="color" style="background:#007aff" onclick="setDescColor('#007aff')"></button>
   <button class="color" style="background:#af52de" onclick="setDescColor('#af52de')"></button>
  </div>
  <button class="orange" style="width:100%;margin-top:18px" onclick="saveDescription()">СОХРАНИТЬ</button>
 </div>
</div>

<div class="chat-panel" id="chatPanel">
 <div class="chat-header"><button class="back" onclick="closeChat()">НАЗАД</button><strong>Чат с CreUser</strong></div>
 <div class="messages" id="messages"></div>
 <div class="chat-input">
  <input id="messageInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')sendMessage()">
  <button class="orange" onclick="sendMessage()">ОТПРАВИТЬ</button>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
const defaultProjects=[
 {title:"COcom",author:"CreUser",desc:"Игра на угадывание правильного числа от 1 до 10.",icon:"CO"},
 {title:"Pixel Lab",author:"Maks",desc:"Инструмент для создания пиксельных проектов.",icon:"PL"},
 {title:"NoteFlow",author:"Lina",desc:"Минималистичное приложение для заметок.",icon:"NF"},
 {title:"Orbit",author:"Dima",desc:"Небольшая аркадная игра.",icon:"OR"},
 {title:"ColorBox",author:"Sasha",desc:"Эксперименты с цветом и интерфейсами.",icon:"CB"},
 {title:"Runner",author:"Alex",desc:"Быстрая мобильная игра.",icon:"RN"}
];
let projects=defaultProjects;
let uploadType=null, descColor="#fff";

function renderProjects(){
 const box=document.getElementById("projects");
 box.innerHTML=projects.map((p,i)=>`
 <article class="card" onclick="toast('Открываем проект: ${escapeHtml(p.title)}')">
   <div class="thumb">${escapeHtml(p.icon)}</div>
   <div class="card-body">
    <h3>${escapeHtml(p.title)}</h3>
    <p>${escapeHtml(p.desc)}</p>
    <div class="meta">Автор: ${escapeHtml(p.author)}</div>
   </div>
 </article>`).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function switchPage(page){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".nav-btn").forEach(x=>x.classList.remove("active"));
 if(page==="projects"){
  document.getElementById("projectsPage").classList.add("active");
  document.getElementById("projectsNav").classList.add("active");
 }else{
  document.getElementById("profilePage").classList.add("active");
  document.getElementById("profileNav").classList.add("active");
 }
}
function openUpload(type){
 uploadType=type;
 const bd=document.getElementById("sheetBackdrop");
 document.getElementById("sheetTitle").textContent="Меняем элемент";
 document.getElementById("sheetText").innerHTML=type==="cover"
 ?"Должно быть <span class='orange-text'>1920×768 пикселей</span>."
 :"Выберите изображение для аватарки.";
 document.getElementById("cropArea").hidden=true;
 document.getElementById("cropPreview").src="";
 document.getElementById("fileInput").value="";
 bd.classList.add("open");
}
function closeSheet(e){if(e.target.id==="sheetBackdrop")e.target.classList.remove("open")}

document.getElementById("fileInput").addEventListener("change",e=>{
 const file=e.target.files[0]; if(!file)return;
 if(!file.type.startsWith("image/")){toast("Это не изображение");return;}
 const reader=new FileReader();
 reader.onload=ev=>{
   const url=ev.target.result;
   if(uploadType==="cover"){
     const img=document.getElementById("coverImg");
     img.src=url;img.hidden=false;document.getElementById("coverPlaceholder").hidden=true;
     try{localStorage.setItem("crestore_cover",url)}catch{toast("Файл слишком большой")}
     document.getElementById("sheetBackdrop").classList.remove("open");
     toast("Обложка загружена");
   }else{
     document.getElementById("cropPreview").src=url;
     document.getElementById("cropArea").hidden=false;
   }
 };
 reader.onerror=()=>toast("Не удалось прочитать файл");
 reader.readAsDataURL(file);
});

function applyAvatar(){
 const src=document.getElementById("cropPreview").src;
 if(!src)return;
 const img=document.getElementById("avatarImg");
 img.src=src;img.hidden=false;document.getElementById("avatarPlaceholder").hidden=true;
 try{localStorage.setItem("crestore_avatar",src)}catch{toast("Файл слишком большой")}
 document.getElementById("sheetBackdrop").classList.remove("open");
 toast("Аватарка обновлена");
}
function openDescription(){
 document.getElementById("descInput").value=document.getElementById("description").textContent;
 document.getElementById("descriptionSheet").classList.add("open");
}
function closeDescription(e){if(e.target.id==="descriptionSheet")e.target.classList.remove("open")}
function setDescColor(c){descColor=c;document.getElementById("description").style.color=c}
function saveDescription(){
 const d=document.getElementById("descInput").value.trim();
 document.getElementById("description").textContent=d||"Описание профиля";
 document.getElementById("description").style.color=descColor;
 localStorage.setItem("crestore_desc",d);
 localStorage.setItem("crestore_desc_color",descColor);
 document.getElementById("descriptionSheet").classList.remove("open");
 toast("Профиль сохранён");
}
function follow(){
 const b=document.getElementById("followBtn");
 b.textContent=b.textContent==="ПОДПИСАТЬСЯ"?"ВЫ ПОДПИСАНЫ":"ПОДПИСАТЬСЯ";
 b.style.background=b.textContent==="ВЫ ПОДПИСАНЫ"?"#fff":"var(--orange)";
 toast(b.textContent==="ВЫ ПОДПИСАНЫ"?"Подписка оформлена":"Подписка отменена");
}

/* ===== ЧАТ ЧЕРЕЗ WEBSOCKET ===== */
let socket=null;
let myName="Гость";

function connectChat(){
 if(socket && (socket.readyState===WebSocket.OPEN || socket.readyState===WebSocket.CONNECTING)) return socket;

 const proto=location.protocol==="https:"?"wss:":"ws:";
 const url=proto+"//"+location.host+"/ws";

 try{
   socket=new WebSocket(url);
 }catch(e){
   toast("Не удалось подключиться к чату");
   return null;
 }

 socket.addEventListener("open",()=>{ console.log("Чат подключён"); });

 socket.addEventListener("message",(event)=>{
   let data;
   try{data=JSON.parse(event.data)}catch{return}
   if(data.type==="history"){
     renderMessages(data.messages);
   }else if(data.type==="message"){
     appendMessage(data.message);
   }
 });

 socket.addEventListener("close",()=>{
   console.log("Чат отключён, переподключение через 2 сек");
   setTimeout(()=>{ if(document.getElementById("chatPanel").classList.contains("open")) connectChat(); },2000);
 });

 socket.addEventListener("error",()=>{ try{socket.close()}catch{} });

 return socket;
}

function openChat(){
 document.getElementById("chatPanel").classList.add("open");
 connectChat();
 renderMessages([]);
}
function closeChat(){
 document.getElementById("chatPanel").classList.remove("open");
}

function renderMessages(arr){
 const box=document.getElementById("messages");
 if(!arr || !arr.length){
   box.innerHTML='<div class="empty">Начните разговор.</div>';
   return;
 }
 box.innerHTML=arr.map(m=>msgHtml(m)).join("");
 box.scrollTop=box.scrollHeight;
}

function appendMessage(m){
 const box=document.getElementById("messages");
 const empty=box.querySelector(".empty");
 if(empty) empty.remove();
 box.insertAdjacentHTML("beforeend",msgHtml(m));
 box.scrollTop=box.scrollHeight;
}

function msgHtml(m){
 const mine=(m.from===myName);
 return `<div class="msg ${mine?'me':'other'}">
   <div class="who">${escapeHtml(m.from||"Гость")}</div>
   ${escapeHtml(m.text)}
 </div>`;
}

function sendMessage(){
 const input=document.getElementById("messageInput");
 const text=input.value.trim();
 if(!text) return;

 if(!socket || socket.readyState!==WebSocket.OPEN){
   toast("Нет соединения с сервером");
   return;
 }
 socket.send(JSON.stringify({text,from:myName}));
 input.value="";
}
/* ===== /ЧАТ ===== */

function toast(t){
 const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");
 setTimeout(()=>x.classList.remove("show"),1800);
}
function loadProfile(){
 const a=localStorage.getItem("crestore_avatar"),c=localStorage.getItem("crestore_cover"),d=localStorage.getItem("crestore_desc"),dc=localStorage.getItem("crestore_desc_color");
 if(a){avatarImg.src=a;avatarImg.hidden=false;avatarPlaceholder.hidden=true}
 if(c){coverImg.src=c;coverImg.hidden=false;coverPlaceholder.hidden=true}
 if(d!==null)description.textContent=d;
 if(dc){description.style.color=dc;descColor=dc}
}
let startY=0;
const projectsPage=document.getElementById("projectsPage");
projectsPage.addEventListener("touchstart",e=>startY=e.touches[0].clientY,{passive:true});
projectsPage.addEventListener("touchend",e=>{
 const end=e.changedTouches[0].clientY;
 if(projectsPage.scrollTop+projectsPage.clientHeight>=projectsPage.scrollHeight-8 && end-startY>80)switchPage("profile");
});
renderProjects();loadProfile();
</script>
</body>
</html>
